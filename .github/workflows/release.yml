name: Release

# Publishes Claude-Notch-<version>.zip to a GitHub Release. Either:
#   - on github.com: Releases → Draft a new release → tag v0.1.0 → Publish, or
#   - from a terminal: git tag v0.1.0 && git push origin v0.1.0
on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: write

# A release created on github.com can fire both triggers; run once per tag.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: ./scripts/test.sh

      - name: Build app bundle
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"; VERSION="${TAG#v}"
          VERSION="$VERSION" ./scripts/build-app.sh
          cd build && shasum -a 256 "Claude-Notch-$VERSION.zip" > "Claude-Notch-$VERSION.zip.sha256"

      - name: Write release notes
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"; VERSION="${TAG#v}"
          # This version's section of CHANGELOG.md (from "## <version>" to the next "## ").
          awk -v v="$VERSION" '/^## /{p=($2==v)} p' CHANGELOG.md | tail -n +2 > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "- See the commits below for what changed." > notes.md
            echo "::warning::CHANGELOG.md has no '## $VERSION' section"
          fi
          cat >> notes.md <<EOF

          ### Install
          1. Download \`Claude-Notch-$VERSION.zip\` below, unzip it, and move **Claude Notch** to Applications.
          2. This build isn't notarized by Apple yet. The first time you open it, go to System Settings → Privacy & Security and click **Open Anyway**.
          3. Click **Connect Claude Code** in the notch, then restart any Claude Code sessions that are already open.

          Requires macOS 14+ on Apple Silicon. Weekly and 5-hour limits appear when Claude Code runs in Terminal.
          EOF
          sed -i '' 's/^          //' notes.md
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            build/Claude-Notch-*.zip
            build/Claude-Notch-*.zip.sha256
          body_path: notes.md
          generate_release_notes: true
